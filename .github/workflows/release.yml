name: Release plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build plugin
        run: ./gradlew --no-daemon buildPlugin

      - name: Resolve version and tag
        id: meta
        run: |
          VERSION=$(sed -n "s/^version = '\([^']*\)'/\1/p" build.gradle | head -1)
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [[ "$TAG" != v* ]]; then TAG="v${VERSION}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION tag=$TAG"

      - name: Generate updatePlugins.xml
        run: |
          mkdir -p build/distributions
          cat > build/distributions/updatePlugins.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
            <plugin id="com.borisovcode.gitflow.navigator"
                    url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.meta.outputs.tag }}/gitflow-navigator-${{ steps.meta.outputs.version }}.zip"
                    version="${{ steps.meta.outputs.version }}">
              <idea-version since-build="262" />
              <name>Gitflow Navigator</name>
              <description>Gitflow Navigator - a Git Flow UI for JetBrains IDEs (IntelliJ IDEA, WebStorm, PyCharm). A maintained fork of Git Flow Integration supporting git-flow AVH and git-flow-next.</description>
              <vendor>BORISOVCODE</vendor>
            </plugin>
          </plugins>
          EOF
          cat build/distributions/updatePlugins.xml

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "${{ steps.meta.outputs.version }} — Gitflow Navigator for JetBrains IDEs (2026.2–2026.3)"
          fail_on_unmatched_files: true
          body: |
            **Gitflow Navigator** — a Git Flow UI for IntelliJ IDEA, WebStorm and PyCharm.
            A maintained fork of *Git Flow Integration* supporting both **git-flow AVH** and **git-flow-next**.

            Verified with IntelliJ Platform **2026.2 / 2026.3** (WebStorm and PyCharm).

            **Install from disk**
            1. Download `gitflow-navigator-${{ steps.meta.outputs.version }}.zip` from the Assets section below.
            2. In your IDE: **Settings → Plugins → ⚙ → Install Plugin from Disk…** → select the ZIP.
            3. Restart the IDE.

            **Install or update from the IDE**
            Add a custom plugin repository in *Settings → Plugins → ⚙ → Manage Plugin Repositories…*:
            `https://github.com/${{ github.repository }}/releases/latest/download/updatePlugins.xml`

            Requires a git-flow CLI: [git-flow AVH](https://github.com/petervanderdoes/gitflow-avh)
            or [git-flow-next](https://github.com/gittower/git-flow-next).

            Based on Git Flow Integration by Opher Vishnia and contributors (Apache 2.0).
          files: |
            build/distributions/gitflow-navigator-*.zip
            build/distributions/updatePlugins.xml
